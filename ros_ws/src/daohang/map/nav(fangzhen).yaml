# 1.声明地图图片资源的路径
image: nav(fangzhen).pgm
# 2.地图刻度尺 单位为：米/像素,例如：resolution为0.1，表示1个像素代表现实中的0.1米
resolution: 0.050000
# 3.地图位姿信息：地图世界相对于rviz坐标系的位姿信息，世界原点是在x周朝上时地图的右下角
#要记得一共有三个坐标系：基(机器人)坐标系、里程计坐标系和地图坐标系
origin: [-50.000000, -50.000000, 0.00000]

# 地图中障碍物判断
# 地图结果：在slam地图中，白色代表空闲，黑色代表障碍物，蓝灰色代表未知区域
# 是否为障碍物的判断规则：
# 1）地图中每个像素点都有取值[0,255]，假设为X。相对应的255就是白色，0就是黑色
# 2）随后需要根据像素值计算一个比例p，p=(255-x)/255。白色的p=0，黑色的p=1，蓝灰色的p在0和1之间
# 3）最后根据p和下面的占用阈值和空闲阈值进行判断，p>occupied_thresh则认为是障碍物，p<free_thresh则认为是空闲
# 4）negate表示取反，会把地图颜色倒置，且判断规则也会倒置，即p>occupied_thresh则认为是空闲，p<free_thresh则认为是障碍物

# 4.取反
negate: 0
# 5和6结合可以判断地图上的某个像素是否为障碍物
# 5.占用阈值
occupied_thresh: 0.65
# 6.空闲阈值
free_thresh: 0.196
